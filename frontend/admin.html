<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="admin-layout">

    <!-- ===================== -->
    <!-- SIDEBAR -->
    <!-- ===================== -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="logo-icon">
                E
            </div>

            <div>
                <h4>EVENTORA</h4>
                <small>ADMIN PANEL</small>
            </div>

        </div>

        <nav class="sidebar-menu">

            <a href="#" class="admin-nav active" data-section="stats">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>

            <a href="#" class="admin-nav" data-section="events">
                <i class="bi bi-calendar-event"></i>
                <span>Events</span>
            </a>

            <a href="#" class="admin-nav" data-section="categories">
                <i class="bi bi-tags"></i>
                <span>Categories</span>
            </a>

            <a href="#" class="admin-nav" data-section="users">
                <i class="bi bi-people"></i>
                <span>Users</span>
            </a>

            <a href="#" class="admin-nav" data-section="bookings">
                <i class="bi bi-ticket-perforated"></i>
                <span>Bookings</span>
            </a>

            <a href="#" class="admin-nav" data-section="analytics">
                <i class="bi bi-bar-chart-line"></i>
                <span>Analytics</span>
            </a>

            <a href="#" class="admin-nav" data-section="notifications">
                <i class="bi bi-bell"></i>
                <span>Notifications</span>
            </a>

            <a href="#" class="admin-nav" data-section="settings">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </a>

        </nav>

        <div class="sidebar-footer">

            <button class="logout-btn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>

        </div>

    </aside>

    <!-- ===================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================== -->

    <main class="main-wrapper">

        <!-- ===================== -->
        <!-- TOPBAR -->
        <!-- ===================== -->

        <header class="topbar">

            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    type="text"
                    id="adminEventSearch"
                    placeholder="Search users, events, bookings..."
                >

            </div>

            <div class="topbar-right">

                <button class="icon-btn">

                    <i class="bi bi-bell"></i>

                    <span class="notification-dot"></span>

                </button>

                <div class="admin-profile">

                    <div class="avatar">
                        A
                    </div>

                    <div>

                        <h6 id="adminName">
                            Admin
                        </h6>

                        <small>
                            Administrator
                        </small>

                    </div>

                </div>

            </div>

        </header>

        <!-- ===================== -->
        <!-- WELCOME BANNER -->
        <!-- ===================== -->

        <section class="welcome-banner">

            <div>

                <p id="greeting" class="greeting">

                    Good Morning

                </p>

                <h2>

                    Welcome back,
                    <span id="bannerAdminName">
                        Admin
                    </span>

                </h2>

                <p class="banner-text">

                    Manage events, monitor bookings, track analytics,
                    and keep EVENTORA running smoothly.

                </p>

            </div>

            <div class="banner-graphic">

                <i class="bi bi-bar-chart-fill"></i>

            </div>

        </section>

        <!-- ===================== -->
        <!-- SECTION HEADER -->
        <!-- ===================== -->

        <div class="dashboard-header">

            <div>

                <h3 id="section-title">

                    Dashboard

                </h3>

            </div>

            <div id="header-actions"></div>

        </div>

        <!-- ===================== -->
        <!-- DYNAMIC CONTENT -->
        <!-- ===================== -->

        <section
            id="admin-main-view"
            class="dashboard-content">

        </section>

    </main>

</div>


<!-- ========================================================= -->
<!-- CREATE EVENT MODAL -->
<!-- ========================================================= -->

<div id="createEventModal" class="modal fade" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content bg-dark text-white">

            <div class="modal-header">

                <h5>Create Event</h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input id="title" class="form-control mb-2" placeholder="Title">

                <input id="description" class="form-control mb-2" placeholder="Description">

                <input id="location" class="form-control mb-2" placeholder="Location">

                <input id="price" class="form-control mb-2" placeholder="Price">

                <input id="seats" class="form-control mb-2" placeholder="Seats">

                <input id="date" type="datetime-local" class="form-control mb-2">

                <select id="categorySelect" class="form-select"></select>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                    class="btn btn-primary"
                    onclick="createEvent()">
                    Create Event
                </button>

            </div>

        </div>

    </div>

</div>

<!-- ========================================================= -->
<!-- EDIT EVENT MODAL -->
<!-- ========================================================= -->

<div class="modal fade" id="editEventModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content bg-dark text-white">

            <div class="modal-header">

                <h5>Edit Event</h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input id="edit_title" class="form-control mb-2">

                <input id="edit_location" class="form-control mb-2">

                <input id="edit_price" class="form-control mb-2">

                <input id="edit_seats" class="form-control mb-2">

                <input id="edit_date" type="datetime-local" class="form-control mb-2">

                <textarea
                    id="edit_description"
                    class="form-control"></textarea>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                    class="btn btn-primary"
                    onclick="saveEditedEvent()">
                    Save Changes
                </button>

            </div>

        </div>

    </div>

</div>

<script src="admin.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

function logoutAdmin(){
    window.location.href="events.html";
}

</script>

</body>
</html>
