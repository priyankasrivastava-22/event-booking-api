<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/my-bookings.css">
</head>

<body class="d-flex flex-column">
<main class="flex-grow-1 overflow-auto">
    <div class="container-fluid mt-4 px-4">                                                                             <!-- Main container -->
        <div class="bookings-header">
            <div class="d-flex align-items-center">
            <button type="button" id="backBtn" class="booking-back-btn">                                                <!-- Back button -->
                <i class="bi bi-chevron-left"></i>
            </button>
            <div>
                <h3 class="mb-1">Your Bookings</h3>                                                                     <!-- Title text -->
                <p class="text-muted mb-0">Manage your booked events here.</p>
            </div>
            </div>

            <div class="header-actions">                                                                                <!-- Header Actions -->
                <div class="search-box">
                    <i class="bi bi-search"></i>                                                                        <!-- Search -->
                    <input type="text" id="bookingSearchInput" placeholder="Search your bookings...">
                </div>
                <button class="icon-btn" onclick="window.location.href='notifications.html'">                           <!-- Notifications -->
                    <i class="bi bi-bell"></i>
                </button>
                <button class="icon-btn" onclick="window.location.href='wishlist.html'">                                <!-- Wishlist -->
                    <i class="bi bi-heart"></i>
                </button>
                <button class="icon-btn" onclick="window.location.href='profile.html'">                                 <!-- Profile -->
                    <i class="bi bi-person-circle"></i>
                </button>
            </div>
        </div>

        <div id="bookingsContainer" class="row"></div>                                                                  <!-- Booking cards render here -->
    </div>

</main>

<script src="js/my-bookings.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
