<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users | Eventora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../css/admin_users.css">
</head>
<body>

<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">E</div>
            <div><h4>EVENTORA</h4><small>ADMIN PANEL</small></div>
        </div>
        <nav class="sidebar-menu">
            <a href="../admin.html" class="admin-nav"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="admin_event.html" class="admin-nav"><i class="bi bi-calendar-event"></i><span>Events</span></a>
            <a href="admin_categories.html" class="admin-nav"><i class="bi bi-tags"></i><span>Categories</span></a>
            <a href="admin_users.html" class="admin-nav active"><i class="bi bi-people"></i><span>Users</span></a>
            <a href="admin_bookings.html" class="admin-nav"><i class="bi bi-ticket-perforated"></i><span>Bookings</span></a>
            <a href="admin_analytics.html" class="admin-nav"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
            <a href="admin_notifications.html" class="admin-nav"><i class="bi bi-bell"></i><span>Notifications</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </aside>

    <main class="main-wrapper">

        <div class="users-page-content">

            <div class="page-breadcrumb"><a href="../admin.html">Dashboard</a> <i class="bi bi-chevron-right"></i> <span>Users</span></div>

            <h2 class="users-page-title">Users</h2>

            <div class="events-filter-row">
                <div class="events-search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="filterSearch" placeholder="Search users...">
                </div>

                <div class="select-wrapper">
                    <select id="filterRole" class="form-select">
                        <option value="">All Roles</option>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                    <i class="bi bi-chevron-down select-arrow"></i>
                </div>

                <div class="select-wrapper">
                    <select id="filterStatus" class="form-select">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                    <i class="bi bi-chevron-down select-arrow"></i>
                </div>
            </div>

            <div class="card users-table-card">
                <table class="table table-dark align-middle">
                    <thead>
                        <tr><th>User</th><th>Email</th><th>Role</th><th>Bookings</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="events-pagination-row">
                <div id="paginationControls" class="pagination-controls"></div>
                <span id="paginationSummary" class="pagination-summary"></span>
            </div>

        </div>
    </main>
</div>

<!-- VIEW USER MODAL -->
<div id="viewUserModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header"><h5>User Details</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="viewUserBody"></div>
            <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
        </div>
    </div>
</div>

<!-- EDIT USER MODAL -->
<div id="editUserModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header"><h5>Edit User</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <label class="wizard-label">Role</label>
                <select id="edit_userRole" class="form-select mb-3">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <label class="wizard-label">Status</label>
                <select id="edit_userStatus" class="form-select">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveEditedUser()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script src="../js/admin_users.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>function logoutAdmin(){ window.location.href = "../../pages/login.html"; }</script>
</body>
</html>
