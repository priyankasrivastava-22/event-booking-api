<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics | Eventora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../css/admin_analytics.css">
</head>
<body>

<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">E</div>
            <div><h4>EVENTORA</h4><small>ADMIN PANEL</small></div>
        </div>
        <nav class="sidebar-menu">
            <a href="../admin.html" class="admin-nav"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="admin_event.html" class="admin-nav"><i class="bi bi-calendar-event"></i><span>Events</span></a>
            <a href="admin_categories.html" class="admin-nav"><i class="bi bi-tags"></i><span>Categories</span></a>
            <a href="admin_users.html" class="admin-nav"><i class="bi bi-people"></i><span>Users</span></a>
            <a href="admin_bookings.html" class="admin-nav"><i class="bi bi-ticket-perforated"></i><span>Bookings</span></a>
            <a href="admin_analytics.html" class="admin-nav active"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
            <a href="admin_notifications.html" class="admin-nav"><i class="bi bi-bell"></i><span>Notifications</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </aside>

    <main class="main-wrapper">

        <div class="analytics-page-content">

            <div class="page-breadcrumb"><a href="../admin.html">Dashboard</a> <i class="bi bi-chevron-right"></i> <span>Analytics</span></div>

            <div class="analytics-page-header">
                <h2>Analytics</h2>
                <div class="select-wrapper year-select-wrapper">
                    <select id="yearSelect" class="form-select"></select>
                    <i class="bi bi-chevron-down select-arrow"></i>
                </div>
            </div>

            <div class="analytics-stats-row">
                <div class="analytics-stat-card">
                    <span class="analytics-stat-label">Total Revenue</span>
                    <h3 id="statRevenue">₹0</h3>
                    <span id="statRevenueTrend" class="analytics-stat-trend"></span>
                </div>
                <div class="analytics-stat-card">
                    <span class="analytics-stat-label">Total Bookings</span>
                    <h3 id="statBookings">0</h3>
                    <span id="statBookingsTrend" class="analytics-stat-trend"></span>
                </div>
                <div class="analytics-stat-card">
                    <span class="analytics-stat-label">Total Users</span>
                    <h3 id="statUsers">0</h3>
                    <span id="statUsersTrend" class="analytics-stat-trend"></span>
                </div>
                <div class="analytics-stat-card">
                    <span class="analytics-stat-label">Total Events</span>
                    <h3 id="statEvents">0</h3>
                    <span id="statEventsTrend" class="analytics-stat-trend"></span>
                </div>
            </div>

            <div class="analytics-columns">

                <div class="card analytics-chart-card">
                    <h5>Revenue Over Time</h5>
                    <canvas id="revenueChart" height="180"></canvas>
                </div>

                <div class="card analytics-top-card">
                    <h5>Top Performing Events</h5>
                    <ol id="topEventsList" class="top-events-list"></ol>
                    <button class="btn-view-report" onclick="window.location.href='admin_event.html'">View Full Report</button>
                </div>

            </div>

        </div>
    </main>
</div>

<script src="../js/admin_analytics.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>function logoutAdmin(){ window.location.href = "../../pages/login.html"; }</script>
</body>
</html>
