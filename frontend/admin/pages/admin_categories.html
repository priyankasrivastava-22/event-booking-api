<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories | Eventora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../css/admin_categories.css">
</head>
<body>

<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">E</div>
            <div><h4>EVENTORA</h4><small>ADMIN PANEL</small></div>
        </div>
        <nav class="sidebar-menu">
            <a href="../admin.html" class="admin-nav"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="admin_event.html" class="admin-nav"><i class="bi bi-calendar-event"></i><span>Events</span></a>
            <a href="admin_categories.html" class="admin-nav active"><i class="bi bi-tags"></i><span>Categories</span></a>
            <a href="admin_users.html" class="admin-nav"><i class="bi bi-people"></i><span>Users</span></a>
            <a href="admin_bookings.html" class="admin-nav"><i class="bi bi-ticket-perforated"></i><span>Bookings</span></a>
            <a href="admin_analytics.html" class="admin-nav"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
            <a href="admin_notifications.html" class="admin-nav"><i class="bi bi-bell"></i><span>Notifications</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </aside>

    <main class="main-wrapper">

        <div class="categories-page-content">

            <div class="page-breadcrumb"><a href="../admin.html">Dashboard</a> <i class="bi bi-chevron-right"></i> <span>Categories</span></div>

            <div class="categories-page-header">
                <h2>Categories</h2>
                <button class="btn-create-event" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                    <i class="bi bi-plus-lg"></i> Add Category
                </button>
            </div>

            <div id="categoriesGrid" class="categories-grid">
                <div class="text-muted text-center py-4">Loading...</div>
            </div>

        </div>

    </main>
</div>

<!-- ADD CATEGORY MODAL -->
<div id="addCategoryModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header"><h5>Add Category</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input id="newCategoryName" class="form-control" placeholder="Category name (e.g. Technology)">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="createCategory()">Add Category</button>
            </div>
        </div>
    </div>
</div>

<!-- EDIT CATEGORY MODAL -->
<div id="editCategoryModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header"><h5>Edit Category</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input id="editCategoryName" class="form-control" placeholder="Category name">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveEditedCategory()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script src="../js/admin_categories.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>function logoutAdmin(){ window.location.href = "../../pages/login.html"; }</script>
</body>
</html>
