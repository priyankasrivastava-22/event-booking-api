<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications | Eventora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../css/admin_notifications.css">
</head>
<body>

<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">E</div>
            <div><h4>EVENTORA</h4><small>ADMIN PANEL</small></div>
        </div>
        <nav class="sidebar-menu">
            <a href="../admin.html" class="admin-nav"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="admin_event.html" class="admin-nav"><i class="bi bi-calendar-event"></i><span>Events</span></a>
            <a href="admin_categories.html" class="admin-nav"><i class="bi bi-tags"></i><span>Categories</span></a>
            <a href="admin_users.html" class="admin-nav"><i class="bi bi-people"></i><span>Users</span></a>
            <a href="admin_bookings.html" class="admin-nav"><i class="bi bi-ticket-perforated"></i><span>Bookings</span></a>
            <a href="admin_analytics.html" class="admin-nav"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
            <a href="admin_notifications.html" class="admin-nav active"><i class="bi bi-bell"></i><span>Notifications</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </aside>

    <main class="main-wrapper">

        <div class="notifications-page-content">

            <div class="page-breadcrumb"><a href="../admin.html">Dashboard</a> <i class="bi bi-chevron-right"></i> <span>Notifications</span></div>

            <h2 class="notifications-page-title">Notifications</h2>

            <div class="notifications-columns">

                <div class="card compose-card">
                    <h5>Compose Notification</h5>

                    <label class="wizard-label">Title</label>
                    <input id="notifTitle" class="form-control mb-3" placeholder="Notification title">

                    <label class="wizard-label">Message</label>
                    <textarea id="notifMessage" class="form-control mb-3" rows="5" placeholder="Write your message..."></textarea>

                    <label class="wizard-label">Audience</label>
                    <div class="select-wrapper mb-3">
                        <select id="notifAudience" class="form-select">
                            <option value="all">All Users</option>
                            <option value="registered">Registered Users</option>
                        </select>
                        <i class="bi bi-chevron-down select-arrow"></i>
                    </div>

                    <button class="btn-send-notification" onclick="sendNotification()">
                        <span>Send Notification</span> <i class="bi bi-send-fill"></i>
                    </button>
                    <p id="composeMessage" class="compose-message"></p>
                </div>

                <div class="card history-card">
                    <h5>Notification History</h5>
                    <table class="table table-dark align-middle">
                        <thead>
                            <tr><th>Title</th><th>Audience</th><th>Sent On</th><th>Status</th></tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr><td colspan="4" class="text-center text-muted py-4">Loading...</td></tr>
                        </tbody>
                    </table>
                    <div class="events-pagination-row">
                        <div id="paginationControls" class="pagination-controls"></div>
                        <span id="paginationSummary" class="pagination-summary"></span>
                    </div>
                </div>

            </div>

        </div>
    </main>
</div>

<script src="../js/admin_notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>function logoutAdmin(){ window.location.href = "../../pages/login.html"; }</script>
</body>
</html>
