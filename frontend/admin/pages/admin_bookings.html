<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookings | Eventora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../css/admin_bookings.css">
</head>
<body>

<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">E</div>
            <div><h4>EVENTORA</h4><small>ADMIN PANEL</small></div>
        </div>
        <nav class="sidebar-menu">
            <a href="../admin.html" class="admin-nav"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="admin_event.html" class="admin-nav"><i class="bi bi-calendar-event"></i><span>Events</span></a>
            <a href="admin_categories.html" class="admin-nav"><i class="bi bi-tags"></i><span>Categories</span></a>
            <a href="admin_users.html" class="admin-nav"><i class="bi bi-people"></i><span>Users</span></a>
            <a href="admin_bookings.html" class="admin-nav active"><i class="bi bi-ticket-perforated"></i><span>Bookings</span></a>
            <a href="admin_analytics.html" class="admin-nav"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
            <a href="admin_notifications.html" class="admin-nav"><i class="bi bi-bell"></i><span>Notifications</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </aside>

    <main class="main-wrapper">

        <div class="bookings-page-content">

            <div class="page-breadcrumb"><a href="../admin.html">Dashboard</a> <i class="bi bi-chevron-right"></i> <span>Bookings</span></div>

            <h2 class="bookings-page-title">Bookings</h2>

            <div class="bookings-stats-row">
                <div class="booking-stat-card">
                    <span class="booking-stat-label">Today's Bookings</span>
                    <h3 id="statToday" class="stat-blue">0</h3>
                </div>
                <div class="booking-stat-card">
                    <span class="booking-stat-label">Pending</span>
                    <h3 id="statPending" class="stat-amber">0</h3>
                </div>
                <div class="booking-stat-card">
                    <span class="booking-stat-label">Completed</span>
                    <h3 id="statCompleted" class="stat-green">0</h3>
                </div>
                <div class="booking-stat-card">
                    <span class="booking-stat-label">Cancelled</span>
                    <h3 id="statCancelled" class="stat-red">0</h3>
                </div>
            </div>

            <div class="events-filter-row">
                <div class="events-search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="filterSearch" placeholder="Search bookings...">
                </div>

                <div class="select-wrapper">
                    <select id="filterEvent" class="form-select"><option value="">All Events</option></select>
                    <i class="bi bi-chevron-down select-arrow"></i>
                </div>

                <div class="select-wrapper">
                    <select id="filterStatus" class="form-select">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <i class="bi bi-chevron-down select-arrow"></i>
                </div>

                <input type="date" id="filterStartDate" class="date-input" title="From date">
                <input type="date" id="filterEndDate" class="date-input" title="To date">
            </div>

            <div class="card bookings-table-card">
                <table class="table table-dark align-middle">
                    <thead>
                        <tr><th>Booking ID</th><th>User</th><th>Event</th><th>Seats</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="events-pagination-row">
                <div id="paginationControls" class="pagination-controls"></div>
                <span id="paginationSummary" class="pagination-summary"></span>
            </div>

        </div>
    </main>
</div>

<!-- VIEW BOOKING MODAL -->
<div id="viewBookingModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header"><h5>Booking Details</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="viewBookingBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button class="btn btn-danger" id="cancelBookingBtn">Cancel Booking</button>
            </div>
        </div>
    </div>
</div>

<script src="../js/admin_bookings.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>function logoutAdmin(){ window.location.href = "../../pages/login.html"; }</script>
</body>
</html>
